<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Модерация — Природа65</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#234826">
  <link rel="icon" href="/assets/img/icons/icon-192.png" type="image/png">

  <link rel="stylesheet" href="/assets/vendor/leaflet.min.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/map.css">
  <link rel="stylesheet" href="/assets/css/admin.css">

  <script defer src="/assets/vendor/leaflet.min.js"></script>
  <script defer src="/assets/vendor/protomaps-leaflet.js"></script>
  <script defer
          src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
          integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"
          crossorigin="anonymous"></script>
  <script type="module" src="/js/admin/admin.js"></script>
</head>
<body class="admin">
  <header class="app-bar">
    <a class="app-bar__brand" href="/">
      <img class="app-bar__logo" src="/assets/img/icons/icon-96.webp" width="40" height="40" alt="">
      <span class="app-bar__titles">
        <span class="app-bar__name">Природа65</span>
        <span class="app-bar__tagline">Модерация меток</span>
      </span>
    </a>
    <div class="admin-user" id="admin-user" hidden>
      <span class="admin-user__email" id="admin-email"></span>
      <button type="button" class="btn btn--on-brand" id="logout">Выйти</button>
    </div>
  </header>

  <main class="admin-main">
    <p class="admin-status" id="admin-status">Загрузка…</p>

    <!-- Вход -->
    <section class="admin-card" id="login-view" hidden aria-labelledby="login-heading">
      <h1 id="login-heading" class="admin-card__title">Вход для модераторов</h1>
      <form id="login-form" class="admin-form" novalidate>
        <label class="field">
          <span class="field__label">Email</span>
          <input class="field__control" name="email" type="email" autocomplete="username" required>
        </label>
        <label class="field">
          <span class="field__label">Пароль</span>
          <input class="field__control" name="password" type="password" autocomplete="current-password" required>
        </label>
        <p class="form-error" id="login-error" role="alert" hidden></p>
        <button type="submit" class="btn btn--primary">Войти</button>
      </form>
    </section>

    <!-- Нет прав -->
    <section class="admin-card" id="denied-view" hidden>
      <h1 class="admin-card__title">Нет прав модератора</h1>
      <p>Этот аккаунт не добавлен в таблицу администраторов. Обратитесь к владельцу проекта.</p>
    </section>

    <!-- Панель модерации -->
    <section class="moderation" id="moderation-view" hidden aria-label="Модерация меток">
      <div class="moderation__toolbar">
        <div class="admin-tabs" role="tablist" aria-label="Статус меток">
          <button type="button" class="admin-tab" role="tab" data-status="pending" aria-selected="true">
            На проверке <span class="admin-tab__count" data-count="pending">0</span>
          </button>
          <button type="button" class="admin-tab" role="tab" data-status="approved" aria-selected="false">
            На карте <span class="admin-tab__count" data-count="approved">0</span>
          </button>
          <button type="button" class="admin-tab" role="tab" data-status="rejected" aria-selected="false">
            Отклонены <span class="admin-tab__count" data-count="rejected">0</span>
          </button>
        </div>
        <button type="button" class="btn btn--ghost" id="refresh">Обновить</button>
      </div>

      <div class="moderation__body">
        <ol class="moderation__list" id="marker-list" aria-live="polite"></ol>
        <div class="moderation__map" id="admin-map" aria-label="Карта меток"></div>
      </div>
    </section>
  </main>

  <template id="marker-item-template">
    <li class="mod-item">
      <article class="mod-item__card">
        <header class="mod-item__head">
          <span class="mod-item__category" data-category></span>
          <time class="mod-item__date" data-date></time>
        </header>
        <h2 class="mod-item__title" data-title></h2>
        <p class="mod-item__text" data-description></p>
        <p class="mod-item__coords" data-coords></p>
        <div class="mod-item__actions" data-actions></div>
      </article>
    </li>
  </template>

  <template id="marker-edit-template">
    <form class="mod-edit" novalidate>
      <label class="field">
        <span class="field__label">Название</span>
        <input class="field__control" name="title" type="text" required minlength="3" maxlength="80">
      </label>
      <label class="field">
        <span class="field__label">Описание</span>
        <textarea class="field__control" name="description" rows="4" maxlength="1000"></textarea>
      </label>
      <label class="field">
        <span class="field__label">Категория</span>
        <select class="field__control" name="category" required></select>
      </label>
      <div class="mod-edit__coords">
        <label class="field">
          <span class="field__label">Широта</span>
          <input class="field__control" name="latitude" type="number" step="0.00001" min="45.8" max="54.5" required>
        </label>
        <label class="field">
          <span class="field__label">Долгота</span>
          <input class="field__control" name="longitude" type="number" step="0.00001" min="141.5" max="145" required>
        </label>
      </div>
      <p class="mod-edit__hint">Точку можно перетащить на карте.</p>
      <div class="field">
        <span class="field__label">Своя иконка</span>
        <div class="mod-edit__icon">
          <img class="mod-edit__icon-preview" data-icon-preview alt="" hidden>
          <select class="field__control" name="icon_url" aria-label="Иконка метки">
            <option value="">Иконка категории</option>
          </select>
        </div>
        <label class="mod-edit__upload">
          <span>Загрузить PNG или WebP до 256 КБ</span>
          <input type="file" name="icon_file" accept="image/png,image/webp">
        </label>
      </div>
      <p class="form-error" data-edit-error role="alert" hidden></p>
      <div class="mod-edit__actions">
        <button type="button" class="btn btn--ghost" data-edit-cancel>Отмена</button>
        <button type="submit" class="btn btn--primary">Сохранить</button>
      </div>
    </form>
  </template>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
